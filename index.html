<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="script.js"></script>

    <div id="studentresultcard">

        <header>
            <h1>Student Result Checker</h1>
            <p>Enter your details to check your result</p>
        </header>

        <form>

            <label for="studentname">Student Name:</label>
            <input 
                type="text" 
                id="studentname"
                placeholder="Enter your name"
            >

            <label for="percentage">Enter a score (0-100):</label>

            <input 
                type="number" 
                id="percentage" 
                name="percentage" 
                min="0" 
                max="100" 
                placeholder="Enter your marks"
            >

            <button type="button">Check Result</button>

            <div id="result"></div>

        </form>

    </div>

</body>
</html>
